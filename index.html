<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>チャージ料金計算</title>

  <!-- PWA / icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8c8dc">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="apple-touch-icon" href="android-chrome-192x192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background-color: rgba(248,200,220,0.8);
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .title-logo {
      max-width: 100%;
      height: auto;
      margin-bottom: 14px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 10px;
      font-weight: 600;
    }

    select,
    input[type="time"],
    button {
      width: 100%;
      padding: 8px 36px 8px 8px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-clip: padding-box;
    }

    select {
      -webkit-appearance: menulist-button;
      appearance: menulist-button;
    }

    button {
      background: #e75480;
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
    }

    button:hover {
      opacity: 0.95;
    }

    #result {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 700;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="title.png?v=9" alt="チャージ料金計算" class="title-logo">

    <label for="gender">性別</label>
    <select id="gender">
      <option value="male">男性</option>
      <option value="female">女性</option>
    </select>

    <label for="startTime">入店時刻</label>
    <input type="time" id="startTime" step="300">

    <label for="endTime">退店時刻</label>
    <input type="time" id="endTime" step="300">

    <button id="calcBtn">計算する</button>

    <div id="result"></div>
  </div>

  <script>
    // 2桁表示にする
    function pad(n){
      return String(n).padStart(2, '0');
    }

    // 入力時刻を5分単位に丸める
    function snapTo5Min(timeStr) {
      if (!timeStr) return timeStr;

      const parts = timeStr.split(':');
      const hh = parseInt(parts[0], 10) || 0;
      const mm = parseInt(parts[1], 10) || 0;

      let total = hh * 60 + mm;
      let snapped = Math.round(total / 5) * 5;

      snapped = ((snapped % (24 * 60)) + (24 * 60)) % (24 * 60);

      const nh = Math.floor(snapped / 60);
      const nm = snapped % 60;

      return pad(nh) + ':' + pad(nm);
    }

    // 入力欄の値を5分単位に丸めて反映する
    function snapAndSetInput(el){
      if (!el) return;

      const v = el.value;
      if (!v) return;

      const s = snapTo5Min(v);
      if (s !== v) {
        el.value = s;
      }
    }

    // 料金表
    function getRates(gender, isBar){
      if (gender === 'male') {
        return isBar
          ? { first30: 500, add15: 400 }
          : { first30: 400, add15: 300 };
      }

      return isBar
        ? { first30: 500, add15: 300 }
        : { first30: 400, add15: 200 };
    }

    // Bar料金の時間帯判定
    // 22:00〜翌6:00をBar料金として扱う
    function isBarTime(dateObj){
      const hour = dateObj.getHours();
      return hour >= 22 || hour < 6;
    }

    // 料金計算
    function calculateByRules(gender, startStr, endStr){
      const start = new Date('2000-01-01T' + startStr + ':00');
      const end = new Date('2000-01-01T' + endStr + ':00');

      // 日付を跨いだ場合は、退店時刻を翌日として扱う
      if (end <= start) {
        end.setDate(end.getDate() + 1);
      }

      const diffMin = Math.ceil((end - start) / 60000);

      // 念のため、異常な値を弾く
      if (diffMin <= 0) {
        return {
          ok: false,
          msg: '退店時刻は入店時刻より後にしてください。'
        };
      }

      // 最初の30分
      let total = getRates(gender, isBarTime(start)).first30;

      if (diffMin <= 30) {
        return {
          ok: true,
          total: total
        };
      }

      // 30分を超えた分を15分単位で加算
      const remaining = diffMin - 30;
      const blocks = Math.ceil(remaining / 15);

      for (let i = 0; i < blocks; i++) {
        const blockStart = new Date(start.getTime() + (30 + i * 15) * 60000);
        total += getRates(gender, isBarTime(blockStart)).add15;
      }

      return {
        ok: true,
        total: total
      };
    }

    // 入力欄の丸め処理
    ['startTime', 'endTime'].forEach(function(id){
      const el = document.getElementById(id);
      if (!el) return;

      el.addEventListener('blur', function(){
        snapAndSetInput(el);
      });

      el.addEventListener('change', function(){
        snapAndSetInput(el);
      });

      let timer = null;

      el.addEventListener('input', function(){
        if (timer) clearTimeout(timer);

        timer = setTimeout(function(){
          snapAndSetInput(el);
        }, 250);
      });
    });

    // ボタンイベント
    document.getElementById('calcBtn').addEventListener('click', function(){
      snapAndSetInput(document.getElementById('startTime'));
      snapAndSetInput(document.getElementById('endTime'));

      const startVal = document.getElementById('startTime').value;
      const endVal = document.getElementById('endTime').value;
      const gender = document.getElementById('gender').value;

      if (!startVal || !endVal) {
        document.getElementById('result').innerText = '入店時刻と退店時刻を入力してください。';
        return;
      }

      const res = calculateByRules(gender, startVal, endVal);

      document.getElementById('result').innerText = res.ok
        ? '合計料金: ' + res.total + '円'
        : res.msg;
    });
  </script>
</body>
</html>
